[package]
name = "svggod"
version = "1.2.3"
edition = "2024"
rust-version = "1.88"
description = "Compile declarative diagram descriptions to SVG and check any SVG for correctness, legibility and portability"
license = "MPL-2.0"
repository = "https://github.com/kKEo/svggod"
homepage = "https://github.com/kKEo/svggod"
documentation = "https://kkeo.github.io/svggod/"
readme = "README.md"
keywords = ["svg", "diagram", "lint", "cli", "mcp"]
categories = ["command-line-utilities", "visualization", "development-tools"]
include = [
    "/src/**",
    "/fonts/**",
    "/schemas/**",
    "/examples/**",
    "/themes/**",
    "/README.md",
    "/LICENSE",
]

# Prebuilt binaries from the GitHub release, used by `cargo binstall svggod`.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/svggod-{ version }-{ target }.tar.gz"
bin-dir = "svggod-{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lib]
name = "svggod"
path = "src/lib.rs"

[[bin]]
name = "svggod"
path = "src/main.rs"
required-features = ["cli"]

[features]
default = ["cli"]
# The command line program and the MCP server.
cli = ["dep:clap", "preview"]
# Rasterizing SVG to PNG.
preview = ["dep:resvg"]

# docs.rs shows which items need which feature.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"], optional = true }
glob = "0.3.4"
kurbo = "0.13.1"
resvg = { version = "0.49.0", default-features = false, features = ["text", "raster-images"], optional = true }
roxmltree = "0.21.2"
harfrust = "0.16.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
serde_yaml_ng = "0.10.0"
simplecss = "0.2.2"
svgtypes = "0.16.2"
toml = "1.2.1"
yaml-rust2 = "0.13.0"

[dev-dependencies]
jsonschema = { version = "0.61.1", default-features = false }
tempfile = "3.27.0"
