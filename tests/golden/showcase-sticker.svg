<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 528 1072" data-svggod="1" font-family="Varela Round, Arial Rounded MT Bold, ui-rounded, sans-serif" stroke-linejoin="round" stroke-linecap="round">
  <title>Placing an order</title>
  <desc>How an order goes from the shopper to the warehouse, with payment and stock checked on the way.</desc>
  <defs>
    <marker id="arrow" markerWidth="13" markerHeight="10.4" refX="13" refY="5.2" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L13 5.2L0 10.4Z" fill="#3b1f4e"/></marker>
  </defs>
  <rect x="0" y="0" width="528" height="1072" fill="#f4f0ff"/>
  <g id="group-backend">
    <rect x="104" y="264" width="400" height="496" rx="16" fill="none" stroke="#6a557c" stroke-width="1.5"/>
    <text x="116" y="287.95" font-size="12.5" fill="#6a557c">Backend</text>
  </g>
  <g id="node-shopper" data-step="1">
    <rect x="144" y="24" width="128" height="64" rx="32" fill="#3b1f4e" stroke="#3b1f4e" stroke-width="2.5" transform="translate(0 4)" data-shadow="1"/>
    <rect x="144" y="24" width="128" height="64" rx="32" fill="#ffe0f0" stroke="#3b1f4e" stroke-width="2.5"/>
    <text x="208" y="60.74" text-anchor="middle" font-size="15" fill="#3b1f4e">Shopper</text>
    <circle cx="153.6" cy="33.6" r="9" fill="#7c4dff" data-badge="1"/>
    <text x="153.6" y="37.55" text-anchor="middle" font-size="12.5" fill="#ffffff">1</text>
  </g>
  <g id="node-shop" data-step="1">
    <rect x="152" y="136" width="112" height="80" rx="16" fill="#3b1f4e" stroke="#3b1f4e" stroke-width="2.5" transform="translate(0 4)" data-shadow="1"/>
    <rect x="152" y="136" width="112" height="80" rx="16" fill="#ffe0f0" stroke="#3b1f4e" stroke-width="2.5"/>
    <line x1="152" y1="152" x2="264" y2="152" stroke="#3b1f4e" stroke-width="2.5"/>
    <text x="208" y="188.74" text-anchor="middle" font-size="15" fill="#3b1f4e">Web shop</text>
    <circle cx="152" cy="136" r="9" fill="#7c4dff" data-badge="1"/>
    <text x="152" y="139.95" text-anchor="middle" font-size="12.5" fill="#ffffff">1</text>
  </g>
  <g id="node-api" data-step="2">
    <rect x="152" y="304" width="112" height="64" rx="16" fill="#3b1f4e" stroke="#3b1f4e" stroke-width="2.5" transform="translate(0 4)" data-shadow="1"/>
    <rect x="152" y="304" width="112" height="64" rx="16" fill="#7c4dff" stroke="#3b1f4e" stroke-width="2.5"/>
    <text x="208" y="340.74" text-anchor="middle" font-size="15" fill="#ffffff">Order API</text>
    <circle cx="152" cy="304" r="9" fill="#7c4dff" data-badge="2"/>
    <text x="152" y="307.95" text-anchor="middle" font-size="12.5" fill="#ffffff">2</text>
  </g>
  <g id="node-pay" data-step="2">
    <rect x="24" y="808" width="176" height="64" rx="8" fill="#3b1f4e" stroke="#3b1f4e" stroke-width="2.5" transform="translate(0 4)" data-shadow="1"/>
    <rect x="24" y="808" width="176" height="64" rx="8" fill="#ffe0f0" stroke="#3b1f4e" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="112" y="844.74" text-anchor="middle" font-size="15" fill="#3b1f4e">Payment provider</text>
    <circle cx="24" cy="808" r="9" fill="#7c4dff" data-badge="2"/>
    <text x="24" y="811.95" text-anchor="middle" font-size="12.5" fill="#ffffff">2</text>
  </g>
  <g id="node-stock" data-step="2">
    <polygon points="208,416 288,456 208,496 128,456" fill="#3b1f4e" stroke="#3b1f4e" stroke-width="2.5" transform="translate(0 4)" data-shadow="1"/>
    <polygon points="208,416 288,456 208,496 128,456" fill="#ffe0f0" stroke="#3b1f4e" stroke-width="2.5"/>
    <text x="208" y="460.74" text-anchor="middle" font-size="15" fill="#3b1f4e">In stock?</text>
    <circle cx="168" cy="436" r="9" fill="#7c4dff" data-badge="2"/>
    <text x="168" y="439.95" text-anchor="middle" font-size="12.5" fill="#ffffff">2</text>
  </g>
  <g id="node-orders" data-step="3">
    <path d="M160 552 A48 8 0 0 1 256 552 L256 616 A48 8 0 0 1 160 616 Z" fill="#3b1f4e" stroke="#3b1f4e" stroke-width="2.5" transform="translate(0 4)" data-shadow="1"/>
    <path d="M160 552 A48 8 0 0 1 256 552 L256 616 A48 8 0 0 1 160 616 Z" fill="#ffe0f0" stroke="#3b1f4e" stroke-width="2.5"/>
    <path d="M160 552 A48 8 0 0 0 256 552" fill="none" stroke="#3b1f4e" stroke-width="2.5"/>
    <text x="208" y="594.74" text-anchor="middle" font-size="15" fill="#3b1f4e">Orders</text>
    <circle cx="160" cy="544" r="9" fill="#7c4dff" data-badge="3"/>
    <text x="160" y="547.95" text-anchor="middle" font-size="12.5" fill="#ffffff">3</text>
  </g>
  <g id="node-events" data-step="3">
    <path d="M136 672 L280 672 A8 32 0 0 1 280 736 L136 736 A8 32 0 0 1 136 672 Z" fill="#3b1f4e" stroke="#3b1f4e" stroke-width="2.5" transform="translate(0 4)" data-shadow="1"/>
    <path d="M136 672 L280 672 A8 32 0 0 1 280 736 L136 736 A8 32 0 0 1 136 672 Z" fill="#ffe0f0" stroke="#3b1f4e" stroke-width="2.5"/>
    <path d="M280 672 A8 32 0 0 0 280 736" fill="none" stroke="#3b1f4e" stroke-width="2.5"/>
    <text x="208" y="708.74" text-anchor="middle" font-size="15" fill="#3b1f4e">Order events</text>
    <circle cx="137.6" cy="681.6" r="9" fill="#7c4dff" data-badge="3"/>
    <text x="137.6" y="685.55" text-anchor="middle" font-size="12.5" fill="#ffffff">3</text>
  </g>
  <g id="node-slip" data-step="3">
    <path d="M240 808 L368 808 L368 864 Q336 852 304 864 Q272 876 240 864 Z" fill="#3b1f4e" stroke="#3b1f4e" stroke-width="2.5" transform="translate(0 4)" data-shadow="1"/>
    <path d="M240 808 L368 808 L368 864 Q336 852 304 864 Q272 876 240 864 Z" fill="#ffe0f0" stroke="#3b1f4e" stroke-width="2.5"/>
    <text x="304" y="840.74" text-anchor="middle" font-size="15" fill="#3b1f4e">Packing slip</text>
    <circle cx="240" cy="808" r="9" fill="#7c4dff" data-badge="3"/>
    <text x="240" y="811.95" text-anchor="middle" font-size="12.5" fill="#ffffff">3</text>
  </g>
  <g id="edge-shopper--shop" data-step="1">
    <path d="M208 88 L208 136" fill="none" stroke="#3b1f4e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="223" cy="112" r="9" fill="#7c4dff" data-badge="1"/>
    <text x="223" y="115.95" text-anchor="middle" font-size="12.5" fill="#ffffff">1</text>
    <text x="272.56" y="115.95" text-anchor="middle" font-size="12.5" fill="#3b1f4e">checks out</text>
  </g>
  <g id="edge-shop--api">
    <path d="M208 216 L208 304" fill="none" stroke="#3b1f4e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <text x="250.13" y="241.95" text-anchor="middle" font-size="12.5" fill="#3b1f4e">place order</text>
  </g>
  <g id="edge-api--pay" data-step="2">
    <path d="M168 368 L168 408 L112 408 L112 808" fill="none" stroke="#3b1f4e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="127" cy="508" r="9" fill="#7c4dff" data-badge="2"/>
    <text x="127" y="511.95" text-anchor="middle" font-size="12.5" fill="#ffffff">2</text>
    <text x="164.07" y="511.95" text-anchor="middle" font-size="12.5" fill="#3b1f4e">charge</text>
  </g>
  <g id="edge-api--stock" data-step="2">
    <path d="M208 368 L208 416" fill="none" stroke="#3b1f4e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="223" cy="392" r="9" fill="#7c4dff" data-badge="2"/>
    <text x="223" y="395.95" text-anchor="middle" font-size="12.5" fill="#ffffff">2</text>
    <text x="261.3" y="395.95" text-anchor="middle" font-size="12.5" fill="#3b1f4e">reserve</text>
  </g>
  <g id="edge-stock--orders" data-step="3">
    <path d="M208 496 L208 544" fill="none" stroke="#3b1f4e" stroke-width="2.5" marker-end="url(#arrow)"/>
    <circle cx="223" cy="520" r="9" fill="#7c4dff" data-badge="3"/>
    <text x="223" y="523.95" text-anchor="middle" font-size="12.5" fill="#ffffff">3</text>
    <text x="252.32" y="523.95" text-anchor="middle" font-size="12.5" fill="#3b1f4e">save</text>
  </g>
  <g id="edge-orders--events" data-step="3">
    <path d="M208 624 L208 672" fill="none" stroke="#3b1f4e" stroke-width="2.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <circle cx="223" cy="648" r="9" fill="#7c4dff" data-badge="3"/>
    <text x="223" y="651.95" text-anchor="middle" font-size="12.5" fill="#ffffff">3</text>
    <text x="261.34" y="651.95" text-anchor="middle" font-size="12.5" fill="#3b1f4e">publish</text>
  </g>
  <g id="edge-events--slip" data-step="3">
    <path d="M208 736 L208 776 L304 776 L304 808" fill="none" stroke="#3b1f4e" stroke-width="2.5" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
    <circle cx="237.87" cy="790" r="9" fill="#7c4dff" data-badge="3"/>
    <text x="237.87" y="793.95" text-anchor="middle" font-size="12.5" fill="#ffffff">3</text>
    <text x="268" y="793.95" text-anchor="middle" font-size="12.5" fill="#3b1f4e">print</text>
  </g>
  <g id="note-1">
    <line x1="312" y1="704" x2="288" y2="704" stroke="#6a557c" stroke-width="1.5" stroke-dasharray="2 3"/>
    <rect x="312" y="688" width="176" height="32" rx="8" fill="#3b1f4e" stroke="#3b1f4e" stroke-width="1.5" transform="translate(0 4)" data-shadow="1"/>
    <rect x="312" y="688" width="176" height="32" rx="8" fill="#d9fbe5" stroke="#6a557c" stroke-width="1.5"/>
    <text x="400" y="707.95" text-anchor="middle" font-size="12.5" fill="#3b1f4e">Delivered at least once</text>
  </g>
  <g id="legend">
    <line x1="24" y1="914" x2="52" y2="914" stroke="#3b1f4e" stroke-width="2.5"/>
    <text x="60" y="917.95" font-size="12.5" fill="#3b1f4e">call</text>
    <line x1="112" y1="914" x2="140" y2="914" stroke="#3b1f4e" stroke-width="2.5" stroke-dasharray="6 4"/>
    <text x="148" y="917.95" font-size="12.5" fill="#3b1f4e">asynchronous message</text>
    <line x1="320" y1="914" x2="348" y2="914" stroke="#3b1f4e" stroke-width="2.5" stroke-dasharray="2 4"/>
    <text x="356" y="917.95" font-size="12.5" fill="#3b1f4e">dependency</text>
    <rect x="26" y="928" width="24" height="12" rx="2" fill="#7c4dff" stroke="#3b1f4e" stroke-width="2.5"/>
    <text x="60" y="937.95" font-size="12.5" fill="#3b1f4e">highlighted</text>
  </g>
  <g id="steps">
    <g id="step-1">
      <circle cx="33" cy="965" r="9" fill="#7c4dff" data-badge="1"/>
      <text x="33" y="968.95" text-anchor="middle" font-size="12.5" fill="#ffffff">1</text>
      <text x="52" y="968.95" font-size="12.5" fill="#3b1f4e">The shopper checks out in the web shop.</text>
    </g>
    <g id="step-2">
      <circle cx="33" cy="991" r="9" fill="#7c4dff" data-badge="2"/>
      <text x="33" y="994.95" text-anchor="middle" font-size="12.5" fill="#ffffff">2</text>
      <text x="52" y="994.95" font-size="12.5" fill="#3b1f4e">The Order API charges the card and reserves the stock.</text>
    </g>
    <g id="step-3">
      <circle cx="33" cy="1017" r="9" fill="#7c4dff" data-badge="3"/>
      <text x="33" y="1020.95" text-anchor="middle" font-size="12.5" fill="#ffffff">3</text>
      <text x="52" y="1020.95" font-size="12.5" fill="#3b1f4e">The order is saved and announced to the warehouse.</text>
    </g>
  </g>
  <g id="caption">
    <text x="24" y="1050.2" font-size="12.5" fill="#6a557c">Payment and stock are checked before the order is saved.</text>
  </g>
</svg>
