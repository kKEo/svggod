<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 1072" data-svggod="1" font-family="Comic Neue, Comic Sans MS, Chalkboard SE, cursive" font-weight="700" stroke-linejoin="round" stroke-linecap="round">
  <title>Placing an order</title>
  <desc>How an order goes from the shopper to the warehouse, with payment and stock checked on the way.</desc>
  <defs>
    <marker id="arrow" markerWidth="15" markerHeight="12" refX="15" refY="6" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L15 6L0 12Z" fill="#fff8e7"/></marker>
  </defs>
  <rect x="0" y="0" width="512" height="1072" fill="#1b1b3a"/>
  <g id="group-backend">
    <rect x="104" y="264" width="384" height="496" rx="12" fill="none" stroke="#b5b5d6" stroke-width="2"/>
    <text x="116" y="288.23" font-size="13" fill="#b5b5d6">Backend</text>
  </g>
  <g id="node-shopper" data-step="1">
    <rect x="152" y="24" width="112" height="64" rx="32" fill="#0a0a1c" stroke="#0a0a1c" stroke-width="3" transform="translate(4 4)" data-shadow="1"/>
    <rect x="152" y="24" width="112" height="64" rx="32" fill="#4338ca" stroke="#fff8e7" stroke-width="3"/>
    <text x="208" y="61.2" text-anchor="middle" font-size="16" fill="#fff8e7">Shopper</text>
    <circle cx="161.6" cy="33.6" r="9" fill="#ffd84d" data-badge="1"/>
    <text x="161.6" y="37.83" text-anchor="middle" font-size="13" fill="#1b1b3a">1</text>
  </g>
  <g id="node-shop" data-step="1">
    <rect x="152" y="136" width="112" height="80" rx="12" fill="#0a0a1c" stroke="#0a0a1c" stroke-width="3" transform="translate(4 4)" data-shadow="1"/>
    <rect x="152" y="136" width="112" height="80" rx="12" fill="#4338ca" stroke="#fff8e7" stroke-width="3"/>
    <line x1="152" y1="152" x2="264" y2="152" stroke="#fff8e7" stroke-width="3"/>
    <text x="208" y="189.2" text-anchor="middle" font-size="16" fill="#fff8e7">Web shop</text>
    <circle cx="152" cy="136" r="9" fill="#ffd84d" data-badge="1"/>
    <text x="152" y="140.23" text-anchor="middle" font-size="13" fill="#1b1b3a">1</text>
  </g>
  <g id="node-api" data-step="2">
    <rect x="152" y="304" width="112" height="64" rx="12" fill="#0a0a1c" stroke="#0a0a1c" stroke-width="3" transform="translate(4 4)" data-shadow="1"/>
    <rect x="152" y="304" width="112" height="64" rx="12" fill="#ffd84d" stroke="#fff8e7" stroke-width="3"/>
    <text x="208" y="341.2" text-anchor="middle" font-size="16" fill="#1b1b3a">Order API</text>
    <circle cx="152" cy="304" r="9" fill="#ffd84d" data-badge="2"/>
    <text x="152" y="308.23" text-anchor="middle" font-size="13" fill="#1b1b3a">2</text>
  </g>
  <g id="node-pay" data-step="2">
    <rect x="24" y="808" width="176" height="64" rx="6" fill="#0a0a1c" stroke="#0a0a1c" stroke-width="3" transform="translate(4 4)" data-shadow="1"/>
    <rect x="24" y="808" width="176" height="64" rx="6" fill="#4338ca" stroke="#fff8e7" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="112" y="845.2" text-anchor="middle" font-size="16" fill="#fff8e7">Payment provider</text>
    <circle cx="24" cy="808" r="9" fill="#ffd84d" data-badge="2"/>
    <text x="24" y="812.23" text-anchor="middle" font-size="13" fill="#1b1b3a">2</text>
  </g>
  <g id="node-stock" data-step="2">
    <polygon points="208,416 288,456 208,496 128,456" fill="#0a0a1c" stroke="#0a0a1c" stroke-width="3" transform="translate(4 4)" data-shadow="1"/>
    <polygon points="208,416 288,456 208,496 128,456" fill="#4338ca" stroke="#fff8e7" stroke-width="3"/>
    <text x="208" y="461.2" text-anchor="middle" font-size="16" fill="#fff8e7">In stock?</text>
    <circle cx="168" cy="436" r="9" fill="#ffd84d" data-badge="2"/>
    <text x="168" y="440.23" text-anchor="middle" font-size="13" fill="#1b1b3a">2</text>
  </g>
  <g id="node-orders" data-step="3">
    <path d="M160 552 A48 8 0 0 1 256 552 L256 616 A48 8 0 0 1 160 616 Z" fill="#0a0a1c" stroke="#0a0a1c" stroke-width="3" transform="translate(4 4)" data-shadow="1"/>
    <path d="M160 552 A48 8 0 0 1 256 552 L256 616 A48 8 0 0 1 160 616 Z" fill="#4338ca" stroke="#fff8e7" stroke-width="3"/>
    <path d="M160 552 A48 8 0 0 0 256 552" fill="none" stroke="#fff8e7" stroke-width="3"/>
    <text x="208" y="595.2" text-anchor="middle" font-size="16" fill="#fff8e7">Orders</text>
    <circle cx="160" cy="544" r="9" fill="#ffd84d" data-badge="3"/>
    <text x="160" y="548.23" text-anchor="middle" font-size="13" fill="#1b1b3a">3</text>
  </g>
  <g id="node-events" data-step="3">
    <path d="M136 672 L280 672 A8 32 0 0 1 280 736 L136 736 A8 32 0 0 1 136 672 Z" fill="#0a0a1c" stroke="#0a0a1c" stroke-width="3" transform="translate(4 4)" data-shadow="1"/>
    <path d="M136 672 L280 672 A8 32 0 0 1 280 736 L136 736 A8 32 0 0 1 136 672 Z" fill="#4338ca" stroke="#fff8e7" stroke-width="3"/>
    <path d="M280 672 A8 32 0 0 0 280 736" fill="none" stroke="#fff8e7" stroke-width="3"/>
    <text x="208" y="709.2" text-anchor="middle" font-size="16" fill="#fff8e7">Order events</text>
    <circle cx="137.6" cy="681.6" r="9" fill="#ffd84d" data-badge="3"/>
    <text x="137.6" y="685.83" text-anchor="middle" font-size="13" fill="#1b1b3a">3</text>
  </g>
  <g id="node-slip" data-step="3">
    <path d="M240 808 L368 808 L368 864 Q336 852 304 864 Q272 876 240 864 Z" fill="#0a0a1c" stroke="#0a0a1c" stroke-width="3" transform="translate(4 4)" data-shadow="1"/>
    <path d="M240 808 L368 808 L368 864 Q336 852 304 864 Q272 876 240 864 Z" fill="#4338ca" stroke="#fff8e7" stroke-width="3"/>
    <text x="304" y="841.2" text-anchor="middle" font-size="16" fill="#fff8e7">Packing slip</text>
    <circle cx="240" cy="808" r="9" fill="#ffd84d" data-badge="3"/>
    <text x="240" y="812.23" text-anchor="middle" font-size="13" fill="#1b1b3a">3</text>
  </g>
  <g id="edge-shopper--shop" data-step="1">
    <path d="M208 88 L208 136" fill="none" stroke="#fff8e7" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="223" cy="112" r="9" fill="#ffd84d" data-badge="1"/>
    <text x="223" y="116.23" text-anchor="middle" font-size="13" fill="#1b1b3a">1</text>
    <text x="270.22" y="116.23" text-anchor="middle" font-size="13" fill="#fff8e7">checks out</text>
  </g>
  <g id="edge-shop--api">
    <path d="M208 216 L208 304" fill="none" stroke="#fff8e7" stroke-width="3" marker-end="url(#arrow)"/>
    <text x="248.31" y="242.23" text-anchor="middle" font-size="13" fill="#fff8e7">place order</text>
  </g>
  <g id="edge-api--pay" data-step="2">
    <path d="M168 368 L168 408 L112 408 L112 808" fill="none" stroke="#fff8e7" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="127" cy="508" r="9" fill="#ffd84d" data-badge="2"/>
    <text x="127" y="512.23" text-anchor="middle" font-size="13" fill="#1b1b3a">2</text>
    <text x="162.48" y="512.23" text-anchor="middle" font-size="13" fill="#fff8e7">charge</text>
  </g>
  <g id="edge-api--stock" data-step="2">
    <path d="M208 368 L208 416" fill="none" stroke="#fff8e7" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="223" cy="392" r="9" fill="#ffd84d" data-badge="2"/>
    <text x="223" y="396.23" text-anchor="middle" font-size="13" fill="#1b1b3a">2</text>
    <text x="259.64" y="396.23" text-anchor="middle" font-size="13" fill="#fff8e7">reserve</text>
  </g>
  <g id="edge-stock--orders" data-step="3">
    <path d="M208 496 L208 544" fill="none" stroke="#fff8e7" stroke-width="3" marker-end="url(#arrow)"/>
    <circle cx="223" cy="520" r="9" fill="#ffd84d" data-badge="3"/>
    <text x="223" y="524.23" text-anchor="middle" font-size="13" fill="#1b1b3a">3</text>
    <text x="250.86" y="524.23" text-anchor="middle" font-size="13" fill="#fff8e7">save</text>
  </g>
  <g id="edge-orders--events" data-step="3">
    <path d="M208 624 L208 672" fill="none" stroke="#fff8e7" stroke-width="3" stroke-dasharray="6 4" marker-end="url(#arrow)"/>
    <circle cx="223" cy="648" r="9" fill="#ffd84d" data-badge="3"/>
    <text x="223" y="652.23" text-anchor="middle" font-size="13" fill="#1b1b3a">3</text>
    <text x="259.03" y="652.23" text-anchor="middle" font-size="13" fill="#fff8e7">publish</text>
  </g>
  <g id="edge-events--slip" data-step="3">
    <path d="M208 736 L208 776 L304 776 L304 808" fill="none" stroke="#fff8e7" stroke-width="3" stroke-dasharray="2 4" marker-end="url(#arrow)"/>
    <circle cx="238.69" cy="790" r="9" fill="#ffd84d" data-badge="3"/>
    <text x="238.69" y="794.23" text-anchor="middle" font-size="13" fill="#1b1b3a">3</text>
    <text x="268" y="794.23" text-anchor="middle" font-size="13" fill="#fff8e7">print</text>
  </g>
  <g id="note-1">
    <line x1="312" y1="704" x2="288" y2="704" stroke="#b5b5d6" stroke-width="2" stroke-dasharray="2 3"/>
    <rect x="312" y="688" width="160" height="32" rx="6" fill="#0a0a1c" stroke="#0a0a1c" stroke-width="2" transform="translate(4 4)" data-shadow="1"/>
    <rect x="312" y="688" width="160" height="32" rx="6" fill="#0f5c7a" stroke="#b5b5d6" stroke-width="2"/>
    <text x="392" y="708.23" text-anchor="middle" font-size="13" fill="#fff8e7">Delivered at least once</text>
  </g>
  <g id="legend">
    <line x1="24" y1="914" x2="52" y2="914" stroke="#fff8e7" stroke-width="3"/>
    <text x="60" y="918.23" font-size="13" fill="#fff8e7">call</text>
    <line x1="104" y1="914" x2="132" y2="914" stroke="#fff8e7" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="140" y="918.23" font-size="13" fill="#fff8e7">asynchronous message</text>
    <line x1="304" y1="914" x2="332" y2="914" stroke="#fff8e7" stroke-width="3" stroke-dasharray="2 4"/>
    <text x="340" y="918.23" font-size="13" fill="#fff8e7">dependency</text>
    <rect x="26" y="928" width="24" height="12" rx="2" fill="#ffd84d" stroke="#fff8e7" stroke-width="3"/>
    <text x="60" y="938.23" font-size="13" fill="#fff8e7">highlighted</text>
  </g>
  <g id="steps">
    <g id="step-1">
      <circle cx="33" cy="965" r="9" fill="#ffd84d" data-badge="1"/>
      <text x="33" y="969.23" text-anchor="middle" font-size="13" fill="#1b1b3a">1</text>
      <text x="52" y="969.23" font-size="13" fill="#fff8e7">The shopper checks out in the web shop.</text>
    </g>
    <g id="step-2">
      <circle cx="33" cy="991" r="9" fill="#ffd84d" data-badge="2"/>
      <text x="33" y="995.23" text-anchor="middle" font-size="13" fill="#1b1b3a">2</text>
      <text x="52" y="995.23" font-size="13" fill="#fff8e7">The Order API charges the card and reserves the stock.</text>
    </g>
    <g id="step-3">
      <circle cx="33" cy="1017" r="9" fill="#ffd84d" data-badge="3"/>
      <text x="33" y="1021.23" text-anchor="middle" font-size="13" fill="#1b1b3a">3</text>
      <text x="52" y="1021.23" font-size="13" fill="#fff8e7">The order is saved and announced to the warehouse.</text>
    </g>
  </g>
  <g id="caption">
    <text x="24" y="1050.72" font-size="13" fill="#b5b5d6">Payment and stock are checked before the order is saved.</text>
  </g>
</svg>
