# Stickers on a lavender page: very round shapes, candy colours and a small shadow below.
version = 1
name = "sticker"
description = "Stickers: very round shapes, candy colours and a small shadow below"

[font]
family = ["Varela Round", "Arial Rounded MT Bold", "ui-rounded", "sans-serif"]
size = 15          # labels in boxes
small = 12.5       # arrow labels, notes, legend, steps and caption

[line]
width = 2.5        # boxes and arrows
thin = 1.5         # frames, notes and guide lines
corner = 16        # rounded kinds (service, client, state) and frames; notes use half
box_corner = 16    # the plain box

[style]
shadow = [0, 4]    # px below each box
round = true       # round line joins and ends
arrow = 1.3        # arrowheads a little larger than the plain size

[light]
background = "#f4f0ff"
text = "#3b1f4e"
muted = "#6a557c"
node_fill = "#ffe0f0"
node_stroke = "#3b1f4e"
accent_fill = "#7c4dff"
accent_text = "#ffffff"
note_fill = "#d9fbe5"
edge = "#3b1f4e"
shadow = "#3b1f4e"

[dark]
background = "#241733"
text = "#f6ecff"
muted = "#c3acd6"
node_fill = "#4a2a66"
node_stroke = "#f0c8ff"
accent_fill = "#ffb3d9"
accent_text = "#241733"
note_fill = "#1f4a3a"
edge = "#f0c8ff"
shadow = "#0f0817"
