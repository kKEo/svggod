<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 624 584" data-svgdog="1" font-family="Inter, sans-serif">
  <title>A support ticket</title>
  <desc>A ticket is triaged, worked on, may wait for the customer, and is closed or reopened.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="624" height="584" fill="#ffffff"/>
  <g id="node-begin">
    <circle cx="320" cy="40" r="12" fill="#1f2937"/>
  </g>
  <g id="node-new">
    <rect x="272" y="104" width="96" height="48" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="320" y="133.09" text-anchor="middle" font-size="14" fill="#1f2937">New</text>
  </g>
  <g id="node-triaged">
    <rect x="272" y="200" width="96" height="48" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="320" y="229.09" text-anchor="middle" font-size="14" fill="#1f2937">Triaged</text>
  </g>
  <g id="node-progress">
    <rect x="256" y="296" width="128" height="48" rx="12" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/>
    <text x="320" y="325.09" text-anchor="middle" font-size="14" fill="#ffffff">In progress</text>
  </g>
  <g id="node-waiting">
    <rect x="24" y="392" width="192" height="48" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="120" y="421.09" text-anchor="middle" font-size="14" fill="#1f2937">Waiting for customer</text>
  </g>
  <g id="node-solved">
    <rect x="472" y="392" width="96" height="48" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="520" y="421.09" text-anchor="middle" font-size="14" fill="#1f2937">Solved</text>
  </g>
  <g id="node-finish">
    <circle cx="520" cy="504" r="11.25" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <circle cx="520" cy="504" r="7" fill="#1f2937"/>
  </g>
  <g id="edge-begin--new">
    <path d="M320 52 L320 104" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-new--triaged">
    <path d="M320 152 L320 200" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="345.85" y="180.37" text-anchor="middle" font-size="12" fill="#1f2937">assign</text>
  </g>
  <g id="edge-triaged--progress">
    <path d="M320 248 L320 296" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="339.87" y="276.37" text-anchor="middle" font-size="12" fill="#1f2937">start</text>
  </g>
  <g id="edge-progress--waiting">
    <path d="M272 344 L272 368 L184 368 L184 392" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="228" y="360.11" text-anchor="middle" font-size="12" fill="#1f2937">ask</text>
  </g>
  <g id="edge-waiting--progress">
    <path d="M200 392 L200 376 L288 376 L288 344" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="244" y="392.63" text-anchor="middle" font-size="12" fill="#1f2937">reply</text>
  </g>
  <g id="edge-progress--solved">
    <path d="M352 344 L352 368 L488 368 L488 392" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="420" y="384.63" text-anchor="middle" font-size="12" fill="#1f2937">fix</text>
  </g>
  <g id="edge-solved--progress">
    <path d="M504 392 L504 360 L368 360 L368 344" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="436" y="352.11" text-anchor="middle" font-size="12" fill="#1f2937">reopen</text>
  </g>
  <g id="edge-solved--finish">
    <path d="M520 440 L520 492" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="561.98" y="470.37" text-anchor="middle" font-size="12" fill="#1f2937">after 7 days</text>
  </g>
  <g id="note-1">
    <line x1="240" y1="416" x2="216" y2="416" stroke="#6b7280" stroke-width="1" stroke-dasharray="2 3"/>
    <rect x="240" y="400" width="192" height="32" rx="4" fill="#ffffff" stroke="#6b7280" stroke-width="1"/>
    <text x="336" y="420.37" text-anchor="middle" font-size="12" fill="#1f2937">Closes itself after 14 days</text>
  </g>
  <g id="caption">
    <text x="24" y="564.37" font-size="12" fill="#6b7280">A closed ticket can be reopened for seven days.</text>
  </g>
</svg>
