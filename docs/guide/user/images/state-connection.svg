<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 168" data-svggod="1" font-family="Inter, sans-serif">
  <title>A network connection</title>
  <desc>A connection is opened, may drop and reconnect, and is finally closed.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L10 4L0 8Z" fill="#1f2937"/></marker>
  </defs>
  <rect x="0" y="0" width="944" height="168" fill="#ffffff"/>
  <g id="node-begin">
    <circle cx="40" cy="88" r="12" fill="#1f2937"/>
  </g>
  <g id="node-idle">
    <rect x="104" y="64" width="96" height="48" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="152" y="93.09" text-anchor="middle" font-size="14" fill="#1f2937">Idle</text>
  </g>
  <g id="node-connecting">
    <rect x="280" y="64" width="128" height="48" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="344" y="93.09" text-anchor="middle" font-size="14" fill="#1f2937">Connecting</text>
  </g>
  <g id="node-open">
    <rect x="480" y="64" width="96" height="48" rx="12" fill="#2563eb" stroke="#1f2937" stroke-width="1.5"/>
    <text x="528" y="93.09" text-anchor="middle" font-size="14" fill="#ffffff">Open</text>
  </g>
  <g id="node-retry">
    <rect x="744" y="24" width="96" height="48" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="792" y="53.09" text-anchor="middle" font-size="14" fill="#1f2937">Retrying</text>
  </g>
  <g id="node-closed">
    <rect x="744" y="104" width="96" height="48" rx="12" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <text x="792" y="133.09" text-anchor="middle" font-size="14" fill="#1f2937">Closed</text>
  </g>
  <g id="node-finish">
    <circle cx="904" cy="128" r="11.25" fill="#dbeafe" stroke="#1f2937" stroke-width="1.5"/>
    <circle cx="904" cy="128" r="7" fill="#1f2937"/>
  </g>
  <g id="edge-begin--idle">
    <path d="M52 88 L104 88" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
  <g id="edge-idle--connecting">
    <path d="M200 80 L280 80" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="240" y="72.11" text-anchor="middle" font-size="12" fill="#1f2937">connect</text>
  </g>
  <g id="edge-connecting--open">
    <path d="M408 96 L480 96" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="444" y="88.11" text-anchor="middle" font-size="12" fill="#1f2937">ok</text>
  </g>
  <g id="edge-connecting--idle">
    <path d="M280 96 L200 96" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="240" y="112.63" text-anchor="middle" font-size="12" fill="#1f2937">refused</text>
  </g>
  <g id="edge-open--retry">
    <path d="M576 88 L664 88 L664 56 L744 56" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="620" y="80.11" text-anchor="middle" font-size="12" fill="#1f2937">dropped</text>
  </g>
  <g id="edge-retry--connecting">
    <path d="M744 40 L432 40 L432 80 L408 80" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="588" y="32.11" text-anchor="middle" font-size="12" fill="#1f2937">backoff</text>
  </g>
  <g id="edge-open--open">
    <path d="M552 64 L552 48 L592 48 L592 80 L576 80" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="627.54" y="60.37" text-anchor="middle" font-size="12" fill="#1f2937">heartbeat</text>
  </g>
  <g id="edge-open--closed">
    <path d="M576 96 L664 96 L664 128 L744 128" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="620" y="112.63" text-anchor="middle" font-size="12" fill="#1f2937">close</text>
  </g>
  <g id="edge-closed--finish">
    <path d="M840 128 L892 128" fill="none" stroke="#1f2937" stroke-width="1.5" marker-end="url(#arrow)"/>
  </g>
</svg>
